[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/provider-kku-payment",
    "crates/api",
    "apps/payment-api",
    "apps/payment-worker",
    "apps/kku-payment-worker",
    "apps/callback-worker",
    "apps/webhook-worker",
    "apps/refund-worker",
    "apps/reconciliation-worker",
    "apps/audit-worker",
    "apps/outbox-publisher",
    "apps/scheduler",
]

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
publish = false

# Versions checked against crates.io on 2026-09-19. Run `cargo update` after
# installing the pinned toolchain to resolve and lock exact patch versions.
[workspace.dependencies]
tokio = { version = "1.53", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "timeout", "compression-full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "rust_decimal", "migrate"] }
redis = { version = "1.7", features = ["tokio-comp", "connection-manager"] }
lapin = "4.12"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
rustls = "0.23"
rust_decimal = { version = "1.43", features = ["serde"] }
uuid = { version = "1.26", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.33"
opentelemetry_sdk = "0.33"
opentelemetry-otlp = "0.33"
tracing-opentelemetry = "0.33"
validator = { version = "0.21", features = ["derive"] }
utoipa = { version = "5.5", features = ["axum_extras", "uuid", "chrono"] }
async-trait = "0.1"

domain = { path = "crates/domain" }
application = { path = "crates/application" }
infrastructure = { path = "crates/infrastructure" }
provider-kku-payment = { path = "crates/provider-kku-payment" }
api = { path = "crates/api" }
